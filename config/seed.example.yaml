# 要追什麼。複製成 config/seed.yaml 再改。
#
# 只在對應的資料表是空的時候套用，之後就以資料庫為準 ——
# 在資料庫停用一個社團，重啟不會被這個檔案加回來。
# 要改已經在跑的設定請直接改資料庫，這個檔案只負責第一次。
#
# 密鑰不放這裡，放 .env。

# 要監控的社團。id 是網址 facebook.com/groups/<id> 中間那串數字。
# 必須先加入該社團，而且用的是容器裡登入的那個帳號。
groups:
  - id: "000000000000000"
    name: 範例社團

  # 這個社團的通知送到另一個 Discord 頻道，而且只通知命中主題詞的貼文。
  - id: "111111111111111"
    name: 另一個社團
    # 只寫環境變數名稱，網址寫在 .env —— 設定檔會跟著備份到處跑。
    webhook_env: DISCORD_WEBHOOK_URL_B
    # 任一命中就通知；整段拿掉表示全部都通知。
    require_patterns:
      - 限量
      - 預購

# 命中就在通知最上面多一行提示，原文一個字都不動。
#
# patterns 建議從社團的歷史貼文挖，不要憑印象列：大家實際在用的講法
# 常常跟正式名稱差很多，縮寫尤其容易漏。
keywords:
  - label: 限量
    line: 限量品出現了
    priority: 10 # 小的排前面；一則命中多個時，稀有的先講
    patterns:
      - 限量
      - 限定
      - Limited

  - label: 預購
    line: 這是預購，不是現貨
    priority: 20
    patterns:
      - 預購
      - 預訂
      - 代訂
    # 命中時在通知裡 tag 比價 bot（需要另外接）。預設關。
    summon: false

# 要盯的 7-11 賣貨便賣場（台灣）。上架、售出、改價都會通知。
# id 是賣場網址 myship.7-11.com.tw/general/detail/<id> 的那串。
# 用不到就整段刪掉。
shops:
  - id: GM0000000000000
    name: 範例賣場
    note: 常跟社團貼文對照的賣家
