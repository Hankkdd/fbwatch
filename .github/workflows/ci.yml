name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The store tests skip silently without FBWATCH_TEST_DSN, and they hold the
    # queue guardrails (e.g. the nil skip list). CI gives them a real Postgres
    # so they always run here.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fbwatch
          POSTGRES_PASSWORD: fbwatch
          POSTGRES_DB: fbwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fbwatch -d fbwatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FBWATCH_TEST_DSN: postgres://fbwatch:fbwatch@localhost:5432/fbwatch_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt -w on these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Rules and their reasons live in .golangci.yml.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...
